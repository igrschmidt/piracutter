[package]
name = "piracutter"
version = "0.1.1"
edition = "2021"
description = "Transforma uma imagem em cortador de biscoitos e carimbo prontos para imprimir"
license = "MIT"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
imageproc = "0.25"
earcutr = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
