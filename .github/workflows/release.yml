name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Bundle the app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./packaging/macos/bundle.sh "$version"
      - name: Zip it
        run: |
          mkdir -p dist/stage
          # ditto, not zip, so the bundle and its signature survive the trip.
          ditto dist/PiraCutter.app dist/stage/PiraCutter.app
          cp README.md LICENSE dist/stage/
          ditto -c -k --sequesterRsrc dist/stage dist/PiraCutter-macos-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/PiraCutter-macos-apple-silicon.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Zip it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/piracutter.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/piracutter.exe, dist/README.md, dist/LICENSE `
            -DestinationPath dist/PiraCutter-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PiraCutter-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PiraCutter $GITHUB_REF_NAME" \
            --latest \
            --notes-file .github/RELEASE_NOTES.md \
            assets/*.zip
